---
name: Unit tests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

# Abort prior jobs in the same workflow / PR
concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Everything is vendored, so make any accidental network access fail fast rather than
      # succeed quietly. A build that needs the proxy is a build an air-gapped management
      # node cannot reproduce, and GOPROXY=off is what turns that into a red job here.
      - name: Build
        run: go build ./...
        env: &vendored
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local

      - name: Run unit tests
        run: go test ./...
        env: *vendored
