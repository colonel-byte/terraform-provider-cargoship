---
name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  # Required status check, so the merge queue waits for a `title_check` result on the
  # merge_group ref too. There is no pull request under that event -- the steps below are
  # skipped and the job reports success, since the title was already linted on the pull
  # request that got queued.
  merge_group:

permissions:
  contents: read

jobs:
  title_check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install commitlint
        if: github.event_name == 'pull_request'
        working-directory: .github/commitlint
        run: npm ci

      # This lints the pull request title, not individual commits, since pull requests here
      # are squash-merged and the title becomes the final commit message.
      # wagoid/commitlint-github-action lints commit messages instead, so it is not a
      # drop-in replacement for this step.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        working-directory: .github/commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "$PR_TITLE" | npx commitlint --config .commitlintrc.yaml
